name: recycle_admin
description: "Smart Recycle Manager - Flutter mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  http: ^1.2.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^20.1.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#F1F8E9"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#F1F8E9"
    theme_color: "#00897B"
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/tahoma.ttf
    - assets/images/logo.png
